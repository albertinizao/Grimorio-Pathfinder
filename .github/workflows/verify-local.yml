name: verify-local

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify-local:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: gestion_grimorio
          MARIADB_USER: gestion_app
          MARIADB_PASSWORD: ci-password
          MARIADB_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright
        run: python -m pip install playwright==1.60.0

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Run local verification
        env:
          SPRING_DATASOURCE_URL: jdbc:mariadb://localhost:3306/gestion_grimorio
          SPRING_DATASOURCE_USERNAME: gestion_app
          SPRING_DATASOURCE_PASSWORD: ci-password
        run: python scripts/verify_local.py
